name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 x86 (COM 32-bit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x86"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: uv sync (dev + ui)
        run: uv sync --group dev --extra ui

      - name: Extract version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $raw = Get-Content pyproject.toml -Raw
          if ($raw -match '(?m)^\s*version\s*=\s*"([^"]+)"') {
            $v = $Matches[1]
            echo "version=$v" >> $env:GITHUB_OUTPUT
            Write-Host "version=$v"
          } else {
            throw "version not found"
          }

      - name: PyInstaller (onefile windowed)
        run: uv run pyinstaller gymflux.spec --noconfirm

      - name: Verify dist\GymFlux.exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/GymFlux.exe)) { throw "dist/GymFlux.exe not found" }
          Get-Item dist/GymFlux.exe | Format-List Name, Length, LastWriteTime

      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/gymflux.iss
          options: /DMyAppVersion=${{ steps.version.outputs.version }}

      - name: Verify installer exists
        shell: pwsh
        run: |
          Get-ChildItem dist/installer -Filter *.exe | Format-Table Name, Length
          if (-not (Test-Path "dist/installer/GymFlux-Setup-v${{ steps.version.outputs.version }}.exe")) {
            # fallback: qualquer exe
            if (-not (Get-ChildItem dist/installer -Filter *.exe)) { throw "installer not found" }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymFlux-Setup-v${{ steps.version.outputs.version }}
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
          # tag v* já vem de github.ref
