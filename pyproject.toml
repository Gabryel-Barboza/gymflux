[project]
name = "gms-app"
version = "0.1.0"
description = "GymFlow (ex-GMS) - Sistema de gerenciamento para academias com integração Henry 7x"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gabryel Barboza", email = "gabrielbarbosa.alternativa@gmail.com" }
]
requires-python = ">=3.11,<3.13"
keywords = ["gym", "henry7x", "turnstile", "biometry", "management"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pefile>=2024.8.26",  # inspeção de DLLs (kernel7x.dll)
]

[project.optional-dependencies]
# UI - instalar apenas quando for desenvolver interface
ui = ["PySide6>=6.7"]
# Windows real - só instala em Windows (ctypes é stdlib, mas pywin32 ajuda)
windows = [
    "pywin32>=306; sys_platform == 'win32'",
]
# Hardware real depende de Windows 32-bit + DLL

[project.scripts]
gms = "gms_app.__main__:main"
gms-app = "gms_app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.11",
    "types-sqlalchemy",
    "pyinstaller>=6.10",
    "pre-commit>=4.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=gms_app --cov-report=term-missing"

[tool.coverage.run]
source = ["gms_app"]
branch = true

[tool.uv]
managed = true
