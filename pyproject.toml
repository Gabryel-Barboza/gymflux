[project]
name = "gymflux"
version = "0.1.0"
description = "GymFlux - Sistema de gerenciamento para academias com integração Henry 7x"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gabryel Barboza", email = "gabrielbarbosa.alternativa@gmail.com" }
]
requires-python = ">=3.11,<3.13"
keywords = ["gym", "henry7x", "turnstile", "biometry", "management"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pefile>=2024.8.26",  # inspeção de DLLs (kernel7x.dll)
]

[project.optional-dependencies]
# UI - instalar apenas quando for desenvolver interface (wheels em Linux/mac/win64;
# em Windows 32-bit use o dual-env: UI no .venv x64, hardware no .venv32 minimal)
ui = ["PySide6>=6.7"]
# Windows real - pywin32 (COM) + comtypes (fallback SComConfig); só em Windows
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
]
# Hardware real depende de Windows 32-bit + DLL

[project.scripts]
gymflux = "gymflux.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "mypy>=1.11",
    "pyinstaller>=6.10",
    "pre-commit>=4.0",
    "pytest-qt>=4.2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Rápido no dia a dia: sem --cov. CI/cobertura explícita:
#   uv run pytest --cov=gymflux --cov-report=term-missing
# xdist avaliado 2026-09-12 e REJEITADO como default (7,5s vs 2,5s serial no
# não-Qt: spawn de workers domina numa suite deste tamanho). Opt-in p/
# máquinas maiores, SEMPRE fora da UI (Qt roda serial):
#   uv run pytest tests/unit -n auto -q
addopts = "-v"
markers = [
    "unit: testes rápidos sem I/O real",
    "integration: testes com SQLite/Qt/alembic",
    "ui: testes PySide6 (offscreen, sempre serial)",
    "slow: teste lento opt-out via -m 'not slow'",
]

[tool.coverage.run]
source = ["gymflux"]
branch = true

[tool.uv]
managed = true
